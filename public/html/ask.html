<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueLock - задать вопрос</title>
    <link rel="icon" href="../static/img/icon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header>
        <a href="index.html">
            <h1>BlueLock</h1>
        </a>
        <div class="header-search">
            <input type="search" class="form-control" placeholder="search" id="inputLogin" aria-describedby="emailHelp">
            <a href="ask.html" rel="noopener noreferrer" title="Задать вопрос"><button type="submit" class="btn-solid theme-primary">Goal!</button></a>
        </div>
        <div class="header-user-info">
            <img class="header-user-avatar" src="../static/img/icon.jpg" alt="Avatar">
            <div class="header-user-actions">
                <span>Itoshi Rin</span>
                <div>
                    <a href="profile.html">Settings</a>
                    <a href="">Logout</a>
                </div>
            </div>
        </div>
    </header>
    <div class="main-aside-layout">
        <main>
            <div class="main-ask">
                <h1>Спросите о наболевшем</h1>
                <form class="ask-question-form">
                    <div class="ask-question-title">
                        <label for="questionTitle" class="form-label">Title</label>
                        <input type="title" class="form-control" id="questionTitle" placeholder="Почему я не топ-1 мира по футболу?" aria-describedby="questionTitle">
                    </div>
                    <div class="ask-question-message">
                        <label for="fieldTextarea" class="form-label">Message</label>
                        <textarea class="form-control" id="fieldTextarea" rows="3" placeholder="Подробнее опишите суть вопроса"></textarea>
                    </div>
                    <div class="ask-question-tags">
                        <label for="questionTags" class="form-label">Tags</label>
                        <input type="title" class="form-control" id="questionTags" placeholder="footbal 2026 ^-^" aria-describedby="questionTags">
                    </div>
                    <div class="ask-question-button">
                        <a href="" rel="noopener noreferrer" title="Задать вопрос"><button type="submit" class="btn-solid theme-primary">Goal!</button></a>
                    </div>
                </form>
            </div>
        </main>
        <aside>
            <div class="aside-tags">
                <h1>Tags</h1>
                
                <div class="aside-tags-row">
                    <span class="badge theme-primary">Lol</span>
                    <span class="badge badge-subtle theme-primary">New</span>
                    <span class="badge badge-outline theme-primary">Cool</span>
                </div>
                <div class="aside-tags-row">
                    <span class="badge theme-primary">2026</span>
                    <span class="badge badge-subtle theme-primary">52</span>
                    <span class="badge badge-outline theme-primary">Footbal</span>
                </div>
                <div class="aside-tags-row">
                    <span class="badge theme-primary">Bluelock</span>
                    <span class="badge badge-subtle theme-primary">Ego</span>
                    <span class="badge badge-outline theme-primary">^-^</span>
                </div>
            </div>
            <div class="aside-members">
                <h1>Best Members</h1>
                <div class="aside-members-list">
                    <a href="/"><h3>Itoshi</h3></a>
                    <a href="/"><h3>Isagi</h3></a>
                    <a href="/"><h3>Bachira</h3></a>
                    <a href="/"><h3>Nagi</h3></a>
                </div>
            </div>
        </aside>
    </div>
    
    <footer>
        <div class="footer-info-block">
            <h4>Ivan Solovev WEB-13</h4>
            <a href="https://github.com/RewithSolo/2026-VK-EDU-Web-13-Solovev-I"><h4>Repo</h4></a>
            <a href="https://t.me/delon1xx"><h4>@delon1xx</h4></a>
            <a href="https://education.vk.company/profile/iva.soloviov/"><h4>VK Education Profile</h4></a>
        </div>
    </footer>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
