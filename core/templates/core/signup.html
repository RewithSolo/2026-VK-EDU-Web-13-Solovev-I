{% extends 'core/base.html' %}

{% block title %}BlueLock - регистрация{% endblock %}

{% block content %}
<div class="main-register">
    <h1>Registration</h1>
    <form class="main-register-form">
        <div class="main-register-form-login">
            <label class="form-label">Login</label>
            <input type="text" class="form-control" placeholder="ваш логин" required>
        </div>
        <div class="main-register-form-email">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="ваша почта" required>
        </div>
        <div class="main-register-form-nick">
            <label class="form-label">Nickname</label>
            <input type="text" class="form-control" placeholder="ваш никнейм" required>
        </div>
        <div class="main-register-form-password">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="ваш пароль" required>
        </div>
        <div class="main-register-form-password">
            <label class="form-label">Repeat Password</label>
            <input type="password" class="form-control" placeholder="ваш пароль" required>
        </div>
        <div class="main-register-form-upload">
            <label class="form-label">Avatar</label>
            <input class="form-control" type="file">
        </div>
        <button type="submit" class="btn-solid theme-primary">Зарегистрироваться</button>
    </form>
    <a href="{% url 'login' %}">есть аккаунт? войти</a>
</div>
{% endblock %}
