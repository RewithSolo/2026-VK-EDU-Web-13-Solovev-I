{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BlueLock{% endblock %}</title>
    <link rel="icon" href="{% static 'img/icon.ico' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'index' %}">
            <h1>BlueLock</h1>
        </a>
        <div class="header-search">
            <input type="search" class="form-control" placeholder="search">
            <a href="{% url 'ask' %}" title="Задать вопрос">
                <button type="button" class="btn-solid theme-primary">Goal!</button>
            </a>
        </div>
        <div class="header-user-info">
            <img class="header-user-avatar" src="{% static 'img/icon.jpg' %}" alt="Avatar">
            <div class="header-user-actions">
                <span>Itoshi Rin</span>
                <div>
                    <a href="{% url 'profile' %}">Settings</a>
                    <a href="#">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="main-aside-layout">
        <main>
            {% block content %}{% endblock %}
        </main>

        <aside>
            {% include 'core/includes/sidebar.html' %}
        </aside>
    </div>

    <footer>
        <div class="footer-info-block">
            <h4>Ivan Solovev WEB-13</h4>
            <a href="https://github.com/RewithSolo/2026-VK-EDU-Web-13-Solovev-I"><h4>Repo</h4></a>
            <a href="https://t.me/delon1xx"><h4>@delon1xx</h4></a>
            <a href="https://education.vk.company/profile/iva.soloviov/"><h4>VK Education Profile</h4></a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
